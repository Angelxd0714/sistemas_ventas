name: web_ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ${{secrets.DB_NAME}}
          POSTGRES_USER: ${DB_USER}
          POSTGRES_PASSWORD: ${USER_PASSWORD}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mydbuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        volumes:
          - postgres_data:/var/lib/postgresql/data
